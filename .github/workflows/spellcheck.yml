name: Spell Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  spellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install aspell
        run: |
          sudo apt-get update
          sudo apt-get install -y aspell aspell-en

      - name: Run spell check on LaTeX source
        run: |
          # Use aspell's TeX mode to ignore LaTeX commands and math
          aspell list --lang=en --mode=tex --add-extra-dicts=.aspell.en.pws < AAA.tex | sort -u > misspelled.txt || true
          if [ -s misspelled.txt ]; then
            echo "Misspelled words found:"
            cat misspelled.txt
            exit 1
          else
            echo "No spelling errors."
          fi
